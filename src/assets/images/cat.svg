<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" width="200" height="250">
  <!-- Tail -->
  <g class="cat-tail">
    <path d="M 45 180 Q 20 160 15 130 Q 10 100 25 85"
          fill="none" stroke="#ff9933" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Body -->
  <ellipse cx="100" cy="170" rx="50" ry="55" fill="#ff9933"/>
  <ellipse cx="100" cy="170" rx="40" ry="45" fill="#ffb366"/>

  <!-- Belly -->
  <ellipse cx="100" cy="180" rx="25" ry="30" fill="#fff5e6"/>

  <!-- Left Leg -->
  <g class="cat-left-paw">
    <rect x="65" y="210" width="18" height="25" rx="9" fill="#ff9933"/>
    <ellipse cx="74" cy="237" rx="12" ry="6" fill="#ff8800"/>
  </g>

  <!-- Right Leg -->
  <g class="cat-right-paw">
    <rect x="117" y="210" width="18" height="25" rx="9" fill="#ff9933"/>
    <ellipse cx="126" cy="237" rx="12" ry="6" fill="#ff8800"/>
  </g>

  <!-- Left Arm -->
  <rect x="50" y="155" width="14" height="30" rx="7" fill="#ff9933" transform="rotate(-15, 57, 155)"/>

  <!-- Right Arm -->
  <rect x="136" y="155" width="14" height="30" rx="7" fill="#ff9933" transform="rotate(15, 143, 155)"/>

  <!-- Head -->
  <circle cx="100" cy="105" r="42" fill="#ff9933"/>

  <!-- Left Ear -->
  <g class="cat-left-ear">
    <polygon points="65,75 55,35 85,60" fill="#ff9933"/>
    <polygon points="68,72 60,42 82,63" fill="#ffcccc"/>
  </g>

  <!-- Right Ear -->
  <g class="cat-right-ear">
    <polygon points="135,75 145,35 115,60" fill="#ff9933"/>
    <polygon points="132,72 140,42 118,63" fill="#ffcccc"/>
  </g>

  <!-- Face -->
  <!-- Eyes -->
  <g class="cat-eyes">
    <ellipse cx="82" cy="100" rx="8" ry="9" fill="#ffffff"/>
    <ellipse cx="118" cy="100" rx="8" ry="9" fill="#ffffff"/>
    <ellipse cx="84" cy="101" rx="5" ry="6" fill="#2d1b69"/>
    <ellipse cx="120" cy="101" rx="5" ry="6" fill="#2d1b69"/>
    <circle cx="86" cy="98" r="2" fill="#ffffff"/>
    <circle cx="122" cy="98" r="2" fill="#ffffff"/>
  </g>

  <!-- Nose -->
  <polygon points="100,110 96,106 104,106" fill="#ff6b9d"/>

  <!-- Mouth -->
  <path d="M 92 114 Q 100 120 108 114" fill="none" stroke="#cc5500" stroke-width="2" stroke-linecap="round"/>

  <!-- Whiskers -->
  <g class="cat-whiskers" stroke="#cc7722" stroke-width="1.5" stroke-linecap="round">
    <line x1="60" y1="105" x2="80" y2="110"/>
    <line x1="58" y1="112" x2="79" y2="113"/>
    <line x1="62" y1="119" x2="80" y2="116"/>
    <line x1="140" y1="105" x2="120" y2="110"/>
    <line x1="142" y1="112" x2="121" y2="113"/>
    <line x1="138" y1="119" x2="120" y2="116"/>
  </g>

  <!-- Cheek blush -->
  <circle cx="72" cy="112" r="8" fill="#ffaaaa" opacity="0.4"/>
  <circle cx="128" cy="112" r="8" fill="#ffaaaa" opacity="0.4"/>
</svg>
